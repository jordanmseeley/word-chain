name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The smoke test drives a real browser against the built app, so it needs
      # Chromium installed. Everything above runs without one.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
